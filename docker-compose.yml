# Desarrollo local. El despliegue en Render no usa este archivo, usa
# render.yaml (ver la raíz del repo).
#
# Desde 2026-09-30 la base es PostgreSQL, no Oracle XE: SISCA fue portado
# para poder desplegar en Render, donde no hay Oracle en capa gratuita.
# SIIHAPI ya venía en PostgreSQL desde la Fase 2.
services:
  postgres:
    image: postgres:16-alpine
    container_name: pinter-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: integracion_pi
      POSTGRES_USER: ${POSTGRES_USER:-pinter_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pinter_admin} -d integracion_pi"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  sisca:
    build: ./SISCA
    container_name: sisca-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./SISCA/.env
    environment:
      # Dentro de la red de Docker, "localhost" apuntaría al propio
      # contenedor sisca, no al de la base — hay que usar el nombre del
      # servicio. El resto de valores (passwords, tokens) vienen del .env.
      POSTGRES_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  siihapi:
    build:
      context: ./SIIHAPI
      dockerfile: backend/Dockerfile
    container_name: siihapi-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./SIIHAPI/backend/.env
    environment:
      POSTGRES_HOST: postgres
      # Idem: para llamar a SISCA desde dentro del contenedor siihapi hay
      # que usar el nombre del servicio, no localhost.
      SISCA_API_URL: http://sisca:8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
