name: Tests

on:
  push:
  pull_request:

jobs:
  sisca-tests:
    name: SISCA (Flask) — 82 tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SISCA
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: SISCA/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-flask

      # Los tests de SISCA mockean la capa de datos por completo (ver
      # tests/conftest.py), así que este job no necesita ninguna base real.
      #
      # Hasta el 2026-10-05 este job estaba en rojo: conftest.py parcheaba
      # `app.database.connection.oracledb`, atributo que desapareció con el
      # port a psycopg del 2026-09-30, y patch() falla si el atributo no
      # existe. Resultado: 80 errores y 2 fallos, y ni una sola prueba de
      # seguridad ejecutándose de verdad durante más de un mes.
      - name: Ejecutar tests
        run: pytest tests/ -v

  siihapi-tests:
    name: SIIHAPI (Django) — 147 tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SIIHAPI/backend

    # Sin bloque `services`: la suite corre sobre SQLite en memoria
    # (siihapi.settings_test_sqlite) y no necesita ninguna base real.
    #
    # Antes este job levantaba un contenedor de Oracle XE y ejecutaba
    # scripts/ci_setup_test_db.py, que hace `import oracledb`. Ese paquete
    # dejó de estar en requirements.txt con el port a PostgreSQL
    # (2026-09-30), así que desde entonces el job moría ahí y cada push a
    # main fallaba en silencio. El contenedor de Oracle y los secretos
    # CI_ORACLE_SYSTEM_PASSWORD / CI_SIIHAPI_DB_PASSWORD ya no hacen falta.

    env:
      DJANGO_SECRET_KEY: ci-django-secret-key-not-for-prod
      JWT_SECRET_KEY: ci-jwt-secret-key-not-for-production-use-only
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      USE_REDIS: "False"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: SIIHAPI/backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-django

      # Las migraciones están en .gitignore (**/migrations/0*.py) por diseño
      # de este repo, así que hay que generarlas antes de correr los tests,
      # y con las MISMAS settings con las que se van a correr: apps.aula_virtual
      # y apps.evaluacion_docente declaran sus tablas con esquema de Postgres
      # ("aula_virtual"."canales") y con nombre plano en cualquier otro motor
      # (aula_virtual_canales) -- ver siihapi/esquemas.py.
      - name: Generar migraciones
        run: python manage.py makemigrations --settings=siihapi.settings_test_sqlite

      - name: Ejecutar tests
        run: pytest tests/ -v --ds=siihapi.settings_test_sqlite
