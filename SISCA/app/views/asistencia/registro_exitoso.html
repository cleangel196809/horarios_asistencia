<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Asistencia Registrada · SISCA</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/css/sisca.css"></head>
<body style="min-height:100vh;display:flex;flex-direction:column;background:var(--bg);">
<header class="topbar"><div class="tb-logo"><img src="/static/img/logo_politecnico.svg" alt="Politécnico" height="34" onerror="this.style.display='none'"><div class="tb-logo-text"><span class="tb-logo-name">SISCA</span></div></div></header>
<main style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div class="auth-card" style="max-width:380px;text-align:center;">
    <div style="width:80px;height:80px;border-radius:50%;background:rgba(46,160,67,.15);border:2px solid var(--green);display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 20px;">✅</div>
    <h2 style="color:var(--green-lt);margin-bottom:8px;">¡Asistencia Registrada!</h2>
    <p style="color:var(--txt2);margin-bottom:24px;">Tu asistencia fue confirmada exitosamente en el sistema SISCA.</p>
    <div style="background:rgba(46,160,67,.08);border:1px solid rgba(46,160,67,.2);border-radius:8px;padding:12px;margin-bottom:20px;">
      <div style="font-size:12px;color:var(--txt2);">Fecha y hora</div>
      <div style="font-size:14px;color:var(--white);font-family:'JetBrains Mono',mono;" id="fechaHora"></div>
    </div>
    <a href="/estudiante/dashboard" class="btn btn-primary btn-full">🏠 Ir a Mi Panel</a>
  </div>
</main>
<script>document.getElementById('fechaHora').textContent=new Date().toLocaleString('es-CO');</script>
</body></html>
