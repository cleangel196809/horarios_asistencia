[pytest]
# SISCA - Configuración de pytest
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Mostrar output de print() durante tests
addopts =
    -v
    --tb=short
    --no-header

# Filtros de advertencias
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
