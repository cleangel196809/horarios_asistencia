{% extends 'base.html' %}
{% block title %}Derivar a Mentoría{% endblock %}
{% block body %}
<div class="app-shell">
  {% include 'dashboard/_sidebar.html' with active='bienestar' %}
  <main class="main-content">
    <div style="margin-bottom:24px;">
      <p style="font-size:13px;color:var(--txt3);text-transform:uppercase;letter-spacing:.10em;font-weight:700;">Bienestar → Mentoría</p>
      <h1 style="font-size:30px;font-weight:800;color:var(--white);">🎓 Derivar Estudiante a Mentoría</h1>
    </div>
    <div class="card">
      <form method="post" style="padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        {% csrf_token %}
        <div>
          <label style="display:block;font-size:12px;color:var(--txt3);margin-bottom:4px;">Caso de Bienestar de origen</label>
          <select name="caso_bienestar_origen" id="id_caso" style="width:100%;padding:8px;border-radius:8px;background:var(--bg-2);color:var(--white);border:1px solid var(--border);">
            <option value="">Sin caso (derivación manual)</option>
            {% for c in casos_sin_mentor %}
            <option value="{{ c.id_caso }}" data-estudiante="{{ c.estudiante.usuario_id }}">Caso #{{ c.id_caso }} — {{ c.estudiante.usuario.nombre_completo }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label style="display:block;font-size:12px;color:var(--txt3);margin-bottom:4px;">Código de estudiante (usuario id)</label>
          <input type="text" name="estudiante" id="id_estudiante" required placeholder="ID del usuario del estudiante" style="width:100%;padding:8px;border-radius:8px;background:var(--bg-2);color:var(--white);border:1px solid var(--border);">
        </div>
        <div style="grid-column:1 / -1;">
          <label style="display:block;font-size:12px;color:var(--txt3);margin-bottom:4px;">Mentor</label>
          <select name="mentor" required style="width:100%;padding:8px;border-radius:8px;background:var(--bg-2);color:var(--white);border:1px solid var(--border);">
            {% for m in mentores %}<option value="{{ m.pk }}">{{ m.nombre_completo }} ({{ m.correo }})</option>{% endfor %}
          </select>
        </div>
        <div style="grid-column:1 / -1;">
          <button type="submit" class="btn btn-primary">Crear asignación</button>
        </div>
      </form>
    </div>
  </main>
</div>
<script>
document.getElementById('id_caso').addEventListener('change', function () {
  var opt = this.options[this.selectedIndex];
  var est = opt.getAttribute('data-estudiante');
  if (est) { document.getElementById('id_estudiante').value = est; }
});
</script>
{% endblock %}
