[pytest]
# SIIHAPI - Configuración de pytest con Django
DJANGO_SETTINGS_MODULE = siihapi.settings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --no-header

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
